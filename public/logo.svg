  <text x="130" y="58" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="3" fill="#1a3c34">PERFECT FOR YOU</text>
  <text x="132" y="82" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="500" letter-spacing="0.5" fill="#5a5a40">Healthy Hair, Happy Skin</text>
</svg>
