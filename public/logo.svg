    <path
      d="M48 18 H74 C91.5 18 102 28.5 102 43 C102 57.5 91 67.5 73.5 67.5 H58.5 V98 C58.5 100.5 56.5 102 53.5 102 C50.5 102 48 100.5 48 98 V18 Z"
      fill="#1a3c34"
